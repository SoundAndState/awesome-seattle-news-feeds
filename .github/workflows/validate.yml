name: Validate published files

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install guidance validation dependency
        run: python -m pip install -r scripts/requirements-agent-guidance.txt
      - name: Check agent guidance links and routing
        run: npm run check:agents
      - name: Compile published files from JSON
        run: npm run build
      - name: Check generated files match JSON
        run: npm run check
      - name: Validate catalog and deduplication
        run: npm run validate
      - name: Lint Awesome List README
        run: npm run lint:readme
        env:
          github_token: ${{ github.token }}
      - name: Lint and validate published OPML
        run: npm run lint:opml
      - name: Test generation and validation failures
        run: npm test
      - name: Test feed health parser
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Build public reader
        run: npm run build:web
      - name: Check Worker bundle
        run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Install desktop and mobile test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Test reader in a browser
        run: npm run test:browser
      - name: Upload generated files for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-catalog
          path: |
            readme.md
            feeds.opml
          retention-days: 7
          if-no-files-found: error
