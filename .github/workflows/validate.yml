name: Validate published files

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep each pull request, merge group, and event in its own group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Replace obsolete validation runs, but let merge-group checks finish.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install guidance validation dependency
        run: python -m pip install -r scripts/requirements-agent-guidance.txt
      - name: Check agent guidance links and routing
        run: npm run check:agents
      - name: Compile published files from JSON
        run: npm run build
      - name: Check generated files match JSON
        run: npm run check
      - name: Validate catalog and deduplication
        run: npm run validate
      - name: Lint Awesome List README
        run: npm run lint:readme
        env:
          github_token: ${{ github.token }}
      - name: Lint and validate published OPML
        run: npm run lint:opml
      - name: Test generation and validation failures
        run: npm test
      - name: Test Python tools and guidance checker
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Build public reader
        run: npm run build:web
      - name: Check Worker bundle
        run: npm run check:proxy
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Upload generated files for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-catalog
          path: |
            readme.md
            feeds.opml
          retention-days: 7
          if-no-files-found: error

  browser:
    name: Browser (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: chromium, browser: chromium}
          - {project: firefox, browser: firefox}
          - {project: webkit, browser: webkit}
          - {project: chromium-mobile, browser: chromium}
          - {project: webkit-mobile, browser: webkit}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build catalog and public reader
        run: |
          npm run build
          npm run build:web
      - name: Install this job's browser
        run: node scripts/browser-tests.mjs install --with-deps ${{ matrix.browser }}
      - name: Test reader
        run: npm run test:browser -- --project=${{ matrix.project }}
      - name: Upload browser failure report and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Keep the existing required check green only when every browser also passes.
  validate:
    if: always()
    needs: [checks, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every validation job to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECKS_RESULT" = success && test "$BROWSER_RESULT" = success
